<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physicist or Mathematician?</title>
<meta name="description" content="Can you tell a physicist from a mathematician by their photo? Can an AI? Play 20 rounds and find out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e0d8;
    --math: #2f6b4f; --math-soft: #e3efe8; --phys: #2b4f8c; --phys-soft: #e2e9f6;
    --good: #2e7d32; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --card: #1e1e22; --ink: #f2f2f4; --muted: #a0a0a8; --line: #2e2e34;
      --math: #6fc39a; --math-soft: #1f3329; --phys: #82a8ec; --phys-soft: #1d2840;
      --good: #6ccf73; --bad: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-family: Caveat, cursive; font-size: 2.6rem; margin: 0 0 4px; text-align: center; line-height: 1.1; }
  h1 .m { color: var(--math); } h1 .p { color: var(--phys); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .bar { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin-bottom: 12px; }
  .photo { width: min(100%, 52vh); margin: 0 auto; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--line); display: block; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 16px 8px; cursor: pointer; transition: transform .08s; }
  button:active { transform: scale(.97); }
  button:disabled { cursor: default; opacity: .5; }
  .btn-m { background: var(--math-soft); color: var(--math); }
  .btn-p { background: var(--phys-soft); color: var(--phys); }
  .btn-main { background: var(--ink); color: var(--bg); width: 100%; margin-top: 16px; }
  .kbd { font-size: .75rem; opacity: .6; display: block; font-weight: 400; margin-top: 2px; }
  .reveal { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg); min-height: 88px; }
  .reveal .name { font-weight: 800; font-size: 1.1rem; }
  .reveal .row { display: flex; justify-content: space-between; margin-top: 6px; font-size: .95rem; }
  .ok { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
  .credit { font-size: .75rem; color: var(--muted); margin-top: 8px; }
  .credit a { color: inherit; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; text-align: center; }
  .scores div { background: var(--bg); border-radius: 12px; padding: 16px 8px; }
  .big { font-size: 2.4rem; font-weight: 800; }
  .verdict { font-family: Caveat, cursive; font-size: 1.9rem; text-align: center; margin: 8px 0 0; }
  .hidden { display: none; }
  .note { font-size: .85rem; color: var(--muted); line-height: 1.5; }
  .tally { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .tally span { width: 14px; height: 14px; border-radius: 4px; background: var(--line); }
  .tally .y { background: var(--good); } .tally .n { background: var(--bad); }
</style>
</head>
<body>
<main>
  <h1><span class="p">Physicist</span> or <span class="m">Mathematician</span>?</h1>
  <p class="sub">20 real scientists. Guess from the photo. Then see if you beat the AI.</p>

  <section id="start" class="card">
    <p class="note">Every photo is a real physicist or mathematician from Wikidata. Our AI model has never seen these people during training. Can your instincts beat it?</p>
    <button class="btn-main" id="go">Start (20 rounds)</button>
    <p class="note" id="best"></p>
  </section>

  <section id="game" class="card hidden">
    <div class="bar"><span id="round"></span><span id="running"></span></div>
    <img id="photo" class="photo" alt="Portrait of a scientist">
    <div class="choices">
      <button class="btn-p" id="gp">Physicist<span class="kbd">← or P</span></button>
      <button class="btn-m" id="gm">Mathematician<span class="kbd">→ or M</span></button>
    </div>
    <div class="reveal" id="reveal"><span class="note">Make your guess…</span></div>
    <button class="btn-main hidden" id="next">Next →</button>
  </section>

  <section id="end" class="card hidden">
    <div class="scores">
      <div><div class="note">You</div><div class="big" id="sYou"></div><div class="tally" id="tYou"></div></div>
      <div><div class="note">The AI</div><div class="big" id="sAI"></div><div class="tally" id="tAI"></div></div>
    </div>
    <p class="verdict" id="verdict"></p>
    <button class="btn-main" id="again">Play again</button>
    <p class="note" id="about"></p>
  </section>
</main>

<script>
const N = 20;
let pool = [], meta = {}, rounds = [], i = 0, you = [], ai = [], answered = false;
const $ = id => document.getElementById(id);
const label = c => c === "physicist" ? "Physicist" : "Mathematician";

function shuffle(a) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function getBest() { try { return JSON.parse(localStorage.getItem("pom-best")); } catch { return null; } }
function setBest(v) { try { localStorage.setItem("pom-best", JSON.stringify(v)); } catch {} }

function showBest() {
  const b = getBest();
  $("best").textContent = b ? `Your best so far: ${b}/${N}` : "";
}

function start() {
  const phys = shuffle(pool.filter(p => p.label === "physicist")).slice(0, N / 2);
  const math = shuffle(pool.filter(p => p.label === "mathematician")).slice(0, N / 2);
  rounds = shuffle(phys.concat(math)); i = 0; you = []; ai = [];
  $("start").classList.add("hidden"); $("end").classList.add("hidden"); $("game").classList.remove("hidden");
  show();
}

function show() {
  answered = false;
  const r = rounds[i];
  $("photo").src = r.img;
  if (rounds[i + 1]) new Image().src = rounds[i + 1].img;
  $("round").textContent = `Round ${i + 1} / ${N}`;
  $("running").textContent = i ? `You ${you.filter(Boolean).length} · AI ${ai.filter(Boolean).length}` : "";
  $("reveal").innerHTML = '<span class="note">Make your guess…</span>';
  $("next").classList.add("hidden");
  $("gp").disabled = $("gm").disabled = false;
}

function guess(g) {
  if (answered) return;
  answered = true;
  const r = rounds[i];
  const aiGuess = r.p >= 0.5 ? "physicist" : "mathematician";
  const conf = Math.round(100 * Math.max(r.p, 1 - r.p));
  you.push(g === r.label); ai.push(aiGuess === r.label);
  $("gp").disabled = $("gm").disabled = true;
  $("reveal").innerHTML = `
    <div class="name">${r.name} — ${label(r.label)}</div>
    <div class="row"><span>You said ${label(g)}</span><span class="${g === r.label ? "ok" : "no"}">${g === r.label ? "✓ correct" : "✗ wrong"}</span></div>
    <div class="row"><span>AI said ${label(aiGuess)} (${conf}% sure)</span><span class="${aiGuess === r.label ? "ok" : "no"}">${aiGuess === r.label ? "✓" : "✗"}</span></div>
    <div class="credit">Photo: <a href="${r.source}" target="_blank" rel="noopener">Wikimedia Commons</a> (see page for author &amp; license)</div>`;
  $("next").textContent = i === N - 1 ? "See results →" : "Next →";
  $("next").classList.remove("hidden");
  $("next").focus();
}

function next() {
  if (!answered) return;
  if (++i < N) return show();
  const y = you.filter(Boolean).length, a = ai.filter(Boolean).length;
  $("game").classList.add("hidden"); $("end").classList.remove("hidden");
  $("sYou").textContent = `${y}/${N}`; $("sAI").textContent = `${a}/${N}`;
  $("tYou").innerHTML = you.map(v => `<span class="${v ? "y" : "n"}"></span>`).join("");
  $("tAI").innerHTML = ai.map(v => `<span class="${v ? "y" : "n"}"></span>`).join("");
  $("verdict").textContent = y > a ? "You beat the machine! 🎉" : y === a ? "A dead tie. Suspicious." : "The AI wins. Humbling.";
  const b = getBest(); if (!b || y > b) setBest(y);
  $("about").innerHTML = `Over all ${meta.n_pool} people in this game, the AI is right ${Math.round(100 * meta.ai_acc_pool)}% of the time (random guessing: 50%). ${meta.note || ""}`;
}

$("go").onclick = start; $("again").onclick = start;
$("gp").onclick = () => guess("physicist"); $("gm").onclick = () => guess("mathematician");
$("next").onclick = next;
document.addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  if (!answered && (e.key === "ArrowLeft" || e.key.toLowerCase() === "p")) guess("physicist");
  else if (!answered && (e.key === "ArrowRight" || e.key.toLowerCase() === "m")) guess("mathematician");
  else if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
});

fetch("data.json").then(r => r.json()).then(d => { pool = d.people; meta = d.meta; showBest(); });
</script>
</body>
</html>
